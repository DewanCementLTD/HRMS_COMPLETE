
# FACE (LMS-Face-Backend - FastAPI/uvicorn on port 8002) - HTTP
# ACME challenge stays on HTTP and is exempt from the proxy, so a renewal can
# validate without the request being forwarded to uvicorn. Everything else
# redirects to HTTPS.
<VirtualHost *:80>
  ServerName face.sysnovix.com

  # Let's Encrypt challenge
  Alias "/.well-known/acme-challenge" "C:/wamp64/www/.well-known/acme-challenge"
  <Directory "C:/wamp64/www/.well-known/acme-challenge">
    Require all granted
  </Directory>

  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^(.*)$ https://face.sysnovix.com$1 [R=301,L]
</VirtualHost>

# FACE - HTTPS reverse proxy to uvicorn (port 8002)
# Cert issued 2026-08-10, expires 2026-11-08. Unlike hrms this one is NOT on
# win-acme auto-renewal yet -- it was installed by hand from PEMs, so it needs
# either a renewal set up or a manual replace before the expiry above.
<VirtualHost *:443>
  ServerName face.sysnovix.com

  SSLEngine on
  SSLCertificateFile "C:/wamp64/ssl/face.sysnovix.com/face.sysnovix.com-crt.pem"
  SSLCertificateKeyFile "C:/wamp64/ssl/face.sysnovix.com/face.sysnovix.com-key.pem"
  SSLCertificateChainFile "C:/wamp64/ssl/face.sysnovix.com/face.sysnovix.com-chain-only.pem"

  ProxyPreserveHost On
  ProxyPass / http://localhost:8002/
  ProxyPassReverse / http://localhost:8002/

  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Host "face.sysnovix.com"
  RequestHeader set X-Forwarded-Port "443"

  <Proxy *>
    Require all granted
  </Proxy>

  ErrorLog "C:/wamp64/logs/face-error.log"
  CustomLog "C:/wamp64/logs/face-access.log" common
</VirtualHost>
