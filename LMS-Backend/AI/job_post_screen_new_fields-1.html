<h2 class="sr-only">Mockup of the redesigned New Job Opening form with new fields needed for AI CV scoring, highlighted with a New badge</h2>
<div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1.25rem 1.5rem;max-width:680px">

<p style="font-size:14px;font-weight:500;color:var(--text-primary);margin:0 0 12px">Basic information</p>

<div style="margin-bottom:14px">
<label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Job title</label>
<input type="text" placeholder="Senior software engineer" style="width:100%">
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
<div><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Department</label>
<input type="text" placeholder="11" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Open positions</label>
<input type="text" placeholder="1" style="width:100%"></div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
<div><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Employment type <span style="background:var(--bg-accent);color:var(--text-accent);font-size:11px;padding:1px 7px;border-radius:var(--radius);margin-left:4px">New</span></label>
<select style="width:100%"><option>Full-time</option><option>Part-time</option><option>Contract</option></select></div>
<div><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Work mode <span style="background:var(--bg-accent);color:var(--text-accent);font-size:11px;padding:1px 7px;border-radius:var(--radius);margin-left:4px">New</span></label>
<select style="width:100%"><option>On-site — Karachi</option><option>Hybrid</option><option>Remote</option></select></div>
</div>

<div style="border-top:0.5px solid var(--border);margin:16px 0"></div>
<p style="font-size:14px;font-weight:500;color:var(--text-primary);margin:0 0 12px">Requirements <span style="font-weight:400;color:var(--text-secondary);font-size:12px">— used for AI CV matching</span></p>

<div style="margin-bottom:14px">
<label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Job description</label>
<textarea placeholder="Describe the role and responsibilities" style="width:100%;height:60px"></textarea>
</div>

<div style="margin-bottom:14px">
<label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Must-have skills <span style="background:var(--bg-accent);color:var(--text-accent);font-size:11px;padding:1px 7px;border-radius:var(--radius);margin-left:4px">New</span></label>
<input type="text" placeholder="Python, Oracle ERP, SQL" style="width:100%">
</div>
<div style="margin-bottom:14px">
<label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Nice-to-have skills <span style="background:var(--bg-accent);color:var(--text-accent);font-size:11px;padding:1px 7px;border-radius:var(--radius);margin-left:4px">New</span></label>
<input type="text" placeholder="Power BI, AWS" style="width:100%">
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
<div><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Min. experience (years) <span style="background:var(--bg-accent);color:var(--text-accent);font-size:11px;padding:1px 7px;border-radius:var(--radius);margin-left:4px">New</span></label>
<input type="text" placeholder="3" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Education requirement <span style="background:var(--bg-accent);color:var(--text-accent);font-size:11px;padding:1px 7px;border-radius:var(--radius);margin-left:4px">New</span></label>
<input type="text" placeholder="Bachelor's, Computer Science" style="width:100%"></div>
</div>

<div style="border-top:0.5px solid var(--border);margin:16px 0"></div>
<p style="font-size:14px;font-weight:500;color:var(--text-primary);margin:0 0 12px">Compensation and status</p>

<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px">
<div><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Salary min <span style="background:var(--bg-accent);color:var(--text-accent);font-size:11px;padding:1px 7px;border-radius:var(--radius);margin-left:4px">New</span></label>
<input type="text" placeholder="PKR 150,000" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Salary max <span style="background:var(--bg-accent);color:var(--text-accent);font-size:11px;padding:1px 7px;border-radius:var(--radius);margin-left:4px">New</span></label>
<input type="text" placeholder="PKR 220,000" style="width:100%"></div>
<div><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">Job status <span style="background:var(--bg-accent);color:var(--text-accent);font-size:11px;padding:1px 7px;border-radius:var(--radius);margin-left:4px">New</span></label>
<select style="width:100%"><option>Draft</option><option>Published</option><option>Closed</option></select></div>
</div>

<div style="display:flex;gap:10px;margin-top:8px">
<button style="background:var(--fill-primary);color:var(--on-primary);border:none">Create job</button>
<button>Cancel</button>
</div>
</div>
